# Auto-deploy Doctor Yachts Next.js → Cloudflare Workers (OpenNext)
# Requires GitHub secrets:
#   CLOUDFLARE_API_TOKEN  (Workers Edit permission)
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy (OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://doctoryachts.com
        run: npx opennextjs-cloudflare build && npx wrangler deploy
